const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// If Chrome already has this password saved, pre-fill it.
window.addEventListener('load', async () => {
  try {
    if (navigator.credentials && navigator.credentials.get) {
      const cred = await navigator.credentials.get({ password: true, mediation: 'optional' });
      if (cred && cred.password) document.getElementById('pw').value = cred.password;
    }
  } catch (_) {}
});
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  btn.disabled = true; err.textContent = '';
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: b64(SALT), iterations: ITER, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(IV) }, key, b64(DATA));
    const html = new TextDecoder().decode(plain);
    // Ask Chrome to save the password for this site (shows its save prompt).
    try {
      if (window.PasswordCredential) {
        await navigator.credentials.store(new PasswordCredential({ id: 'family-planner', password: pw }));
      }
    } catch (_) {}
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = 'Incorrect password — try again.';
    btn.disabled = false;
  }
});
</script>
